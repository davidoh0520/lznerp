<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LZN 대표 전용 수주·발주·도면 통합 업무실">
  <title>LZN 대표 업무실</title>
  <link rel="stylesheet" href="erp.css">
</head>
<body class="landing private-landing">
  <div class="landing-shell private-shell">
    <header class="private-header">
      <a class="brand" href="portal.html">
        <span class="brand-mark">LZ</span>
        <span>LZN PRIVATE OFFICE <small>SALES · PURCHASE · DRAWINGS</small></span>
      </a>
      <span class="private-badge">OWNER ONLY</span>
    </header>

    <main class="owner-hero">
      <img class="owner-hero-image" src="assets/executive-assistant-hero.png" alt="LZN 개인 업무실 비서">
      <div class="owner-hero-shade"></div>
      <section class="owner-hero-copy">
        <div class="eyebrow">LZN EXECUTIVE ASSISTANT</div>
        <h1>대표님,<br>무엇을<br>도와드릴까요?</h1>
        <p>수주, 발주, 도면과 거래 기록을 한곳에서 이어서 관리합니다.</p>
        <div id="portalAccount" class="owner-login-card">
          <div class="loading-dot"></div>
          <span>로그인 상태를 확인하고 있습니다.</span>
        </div>
      </section>
    </main>

    <section id="ownerLinks" class="owner-workspaces" hidden>
      <a class="workspace-card sales" href="order.html">
        <span class="workspace-no">01</span>
        <div><strong>수주관리</strong><p>고객 주문 입력, 견적·진행 상태와 인보이스 관리</p></div>
        <b>→</b>
      </a>
      <a class="workspace-card purchase" href="admin.html?page=suppliers">
        <span class="workspace-no">02</span>
        <div><strong>발주관리</strong><p>공급업체별 발주서 작성과 구매 기록 관리</p></div>
        <b>→</b>
      </a>
      <a class="workspace-card drawings" href="drawings.html">
        <span class="workspace-no">03</span>
        <div><strong>도면관리</strong><p>DWG·PDF·STP 최신본과 모든 이전 버전 보관</p></div>
        <b>→</b>
      </a>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="erp-config.js"></script>
  <script src="erp-core.js"></script>
  <script src="portal-auth.js"></script>
</body>
</html>
